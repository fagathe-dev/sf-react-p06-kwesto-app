# Services de forms_front. Les services de forms-core et de core-php sont déclarés par leurs bundles.
parameters:
    # Pont entre les variables de la spec (MAILER_FROM_*) et les paramètres du mailer de core-php
    core_php.email.default_sender: '%env(MAILER_FROM_ADDRESS)%'
    core_php.email.app_name: '%env(MAILER_FROM_NAME)%'
    # URL publique du site (canonical, OpenGraph, sitemap)
    app.site_url: '%env(DEFAULT_URI)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $siteUrl: '%app.site_url%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

when@dev:
    parameters:
        core_php.email.check_deliverability: false

when@test:
    parameters:
        core_php.email.check_deliverability: false
