# Services de forms_api. Les services de forms-core et de core-php sont déclarés par leurs bundles
# (FormsCoreBundle, CorePhpBundle) : ne pas les recharger ici, cela écraserait leurs arguments.
parameters:
    # Pont entre les variables de la spec (MAILER_FROM_*) et les paramètres du mailer de core-php
    core_php.email.default_sender: '%env(MAILER_FROM_ADDRESS)%'
    core_php.email.app_name: '%env(MAILER_FROM_NAME)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

when@dev:
    parameters:
        # Les adresses des fixtures (example.com…) n'ont pas de serveur de messagerie : pas de contrôle DNS
        core_php.email.check_deliverability: false

when@test:
    parameters:
        # Pas de contrôle DNS des destinataires en test
        core_php.email.check_deliverability: false
